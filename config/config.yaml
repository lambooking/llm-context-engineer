# LLM Context Engineer 配置文件

# VLM服务配置
vlm:
  provider: "openai"  # 服务提供商: openai, azure, 或其他
  api_key: "sk-12"  # API密钥，建议使用环境变量
  base_url: "http://localhost:1237/v1"  # API基础URL
  model: "qwen2.5-vl-7b-instruct"  # 使用的模型
  max_tokens: 18000  # 最大token数
  temperature: 0  # 温度参数

# Prompt配置
prompts:
  dir: "prompts"  # Prompt文件目录
  auto_reload: false  # 是否自动重载Prompt文件

# 分类器配置
classifier:
  confidence_threshold: 0.3  # 分类置信度阈值
  enable_multi_image_detection: true  # 是否启用多图像检测

# 日志配置
logging:
  level: "INFO"  # 日志级别: DEBUG, INFO, WARNING, ERROR
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} - {message}"
  file: "logs/app.log"  # 日志文件路径
  rotation: "10 MB"  # 日志轮转大小
  retention: "7 days"  # 日志保留时间

# 批量处理配置
batch_processing:
  max_concurrent_requests: 1  # 最大并发请求数
  request_interval: 5  # 请求间隔（秒）
  retry_attempts: 3  # 重试次数
  timeout: 600  # 请求超时时间（秒）

# 图像预处理配置
image_preprocessing:
  enabled: true  # 是否启用图像预处理
  max_resolution: [2048, 2048]  # 最大分辨率 [width, height]
  quality: 85  # JPEG压缩质量
  format: "JPEG"  # 输出格式
  cache_dir: "cache/processed_images"  # 预处理缓存目录
  parallel_workers: 4  # 预处理并行工作线程数
  
  # TIF图像处理配置
  tif_processing_enabled: true  # 是否启用TIF处理
  target_tile_size: 2048  # 切片目标尺寸
  grid_rows: 3  # 网格行数
  grid_cols: 3  # 网格列数
  tif_jpeg_quality: 95  # TIF转换JPEG质量

# 优化配置
optimization:
  batch_size: 1  # 每批次处理的查询数量
  memory_cleanup_interval: 5  # 每N个批次执行内存清理
  progressive_processing: true  # 渐进式处理
  max_memory_usage: 75.0  # 最大内存使用率(%)
  image_batch_size: 2  # 图像预处理批次大小

# 应用配置
app:
  name: "LLM Context Engineer"
  version: "1.0.0"
  debug: false
